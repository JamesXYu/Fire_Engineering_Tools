<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主体背景：深碳灰到午夜蓝 -->
    <linearGradient id="bodyGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>

    <!-- 外边框：冷银灰/钛金属质感 -->
    <linearGradient id="rimGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- 屏幕区域：深空蓝 -->
    <linearGradient id="screenGradient" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- 火焰：暖琥珀色 -->
    <linearGradient id="flameGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- 按钮：更亮的青石色，并带明显上下渐变以增强立体感 -->
    <linearGradient id="buttonGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/> <!-- 顶部亮灰蓝 -->
      <stop offset="100%" stop-color="#334155"/> <!-- 底部深青石 -->
    </linearGradient>

    <!-- 按钮顶部高光 -->
    <linearGradient id="buttonHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>

    <!-- 整体投影效果 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- 按钮的悬浮阴影效果（让按钮凸出） -->
    <filter id="buttonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <!-- 底部深色投影 -->
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
      <!-- 顶部微弱反光（模拟环境光） -->
      <feDropShadow dx="0" dy="-2" stdDeviation="2" flood-color="#94a3b8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 外边框 (银灰钛金属) -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#rimGradient)" filter="url(#shadow)"/>

  <!-- 主体内壳 (深碳灰) -->
  <rect x="45" y="45" width="422" height="422" rx="80" fill="url(#bodyGradient)"/>

  <!-- 屏幕区域 -->
  <rect x="100" y="100" width="312" height="130" rx="40" fill="url(#screenGradient)" stroke="#374151" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 火焰图标 -->
  <g filter="url(#shadow)">
    <path d="M256 115 C256 115 210 160 210 195 C210 220 230 240 256 240 C282 240 302 220 302 195 C302 160 256 115 256 115 Z" fill="url(#flameGradient)"/>
    <path d="M256 145 C256 145 235 170 235 190 C235 205 245 215 256 215 C267 215 277 205 277 190 C277 170 256 145 256 145 Z" fill="#fcd34d" fill-opacity="0.3"/>
  </g>


  <circle cx="150" cy="285" r="28" fill="url(#buttonGradient)" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5" filter="url(#buttonShadow)"/>
  <circle cx="256" cy="285" r="28" fill="url(#buttonGradient)" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5" filter="url(#buttonShadow)"/>
  <circle cx="362" cy="285" r="28" fill="url(#buttonGradient)" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5" filter="url(#buttonShadow)"/>

  <circle cx="150" cy="375" r="28" fill="url(#buttonGradient)" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5" filter="url(#buttonShadow)"/>
  <circle cx="256" cy="375" r="28" fill="url(#buttonGradient)" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5" filter="url(#buttonShadow)"/>
  <circle cx="362" cy="375" r="28" fill="url(#buttonGradient)" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5" filter="url(#buttonShadow)"/>

  <circle cx="150" cy="278" r="18" fill="url(#buttonHighlight)"/>
  <circle cx="256" cy="278" r="18" fill="url(#buttonHighlight)"/>
  <circle cx="362" cy="278" r="18" fill="url(#buttonHighlight)"/>
  <circle cx="150" cy="368" r="18" fill="url(#buttonHighlight)"/>
  <circle cx="256" cy="368" r="18" fill="url(#buttonHighlight)"/>
  <circle cx="362" cy="368" r="18" fill="url(#buttonHighlight)"/>
</svg>